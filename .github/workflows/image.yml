name: Build patched Computer image
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve current upstream image
        id: upstream
        run: |
          digest=$(docker buildx imagetools inspect ghcr.io/open-webui/computer:browser --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and run patch regression tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: selfwebui:check
          platforms: linux/amd64
          build-args: |
            UPSTREAM_IMAGE=ghcr.io/open-webui/computer@${{ steps.upstream.outputs.digest }}
            UPSTREAM_DIGEST=${{ steps.upstream.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with fresh data
        run: |
          docker run -d --name smoke --shm-size 512m --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 selfwebui:check
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ > /tmp/page.html; then
              grep -qi '<html' /tmp/page.html && exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag selfwebui:check "$image:latest"
          docker tag selfwebui:check "$image:build-${GITHUB_RUN_NUMBER}"
          docker push "$image:build-${GITHUB_RUN_NUMBER}"
          docker push "$image:latest"
      - name: Logs on failure
        if: failure()
        run: docker logs smoke 2>/dev/null || true
